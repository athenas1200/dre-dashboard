<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>DRE por Período | Evolução Mensal</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap');

        :root {
            --bg-body: #f8fafc;
            --primary: #14b8a6;
            --teal: #10b981;
            --text-main: #1e293b;
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .main-header {
            background: linear-gradient(135deg, #134e4a 0%, #0f766e 50%, #115e59 100%);
            padding: 18px 30px 14px;
            color: white;
            border-bottom: 4px solid #14b8a6;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-sub {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .pill {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.70rem;
            font-weight: 600;
        }

        .pill-teal {
            background: rgba(20, 184, 166, 0.3);
            border: 1px solid rgba(20, 184, 166, 0.5);
        }

        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .ctrl-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }

        .ctrl-select {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 200px;
        }

        .ctrl-select option {
            color: #0f172a;
            background: white;
        }

        .btn-export {
            background: #0d9488;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-nav {
            background: #1e40af;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .kpi-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 10px 18px;
            min-width: 190px;
        }

        .kpi-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .65);
        }

        .kpi-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
        }

        .kpi-sub {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, .55);
        }

        .dashboard-main {
            padding: 10px 20px 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .1);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            flex-grow: 1;
            display: flex;
            min-height: 0;
        }

        .table-viewport {
            overflow: auto;
            flex-grow: 1;
            direction: rtl;
        }

        .exec-table {
            direction: ltr;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.82rem;
        }

        .exec-table th {
            background: #0f172a;
            color: #fff;
            padding: 8px 6px;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 100;
            text-transform: uppercase;
            font-size: 0.6rem;
            border-right: 1px solid rgba(255, 255, 255, .1);
            border-bottom: 2px solid #14b8a6;
            min-width: 90px;
        }

        .exec-table th:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 150;
            background: #020617 !important;
            min-width: 380px;
            box-shadow: 6px 0 12px rgba(0, 0, 0, .4);
        }

        .exec-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .exec-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 10;
            background: white;
            border-right: 2px solid #cbd5e1;
            min-width: 380px;
            font-family: 'Inter', sans-serif;
        }

        .row-group td {
            font-weight: 700;
            background: #f8fafc !important;
        }

        .row-st td {
            background: #e0f2fe !important;
            color: #0369a1 !important;
            font-weight: 800;
        }

        .val-neg {
            color: #991b1b !important;
        }

        .hidden {
            display: none;
        }

        .toggle-btn {
            background: #0d9488;
            color: white;
            border-radius: 4px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 6px;
            font-weight: 900;
            user-select: none;
        }

        .toggle-btn.empty {
            background: transparent;
            cursor: default;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            color: white;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #14b8a6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loading" id="loading-overlay">
        <div class="spinner"></div>
        <div>Carregando dados...</div>
    </div>
    <header class="main-header">
        <div class="header-top">
            <div class="header-content">
                <h1>📅 DRE POR PERÍODO</h1>
                <div class="header-sub">
                    <span class="pill pill-teal" id="pill-filial">—</span>
                    <span class="pill">Evolução Mensal</span>
                    <span class="pill" id="pill-meses">—</span>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-left:auto;">
                <button class="btn-export" style="background:#1e40af;" onclick="window.location.href='index.html'">🏢
                    Consolidado Filiais</button>
                <button class="btn-export" style="background:#7c3aed;"
                    onclick="window.location.href='analise_dre.html'">🧠 Análise DRE</button>
                <button class="btn-export" onclick="exportToExcel()">📥 Exportar Excel</button>
            </div>
        </div>
        <div class="controls-row">
            <span class="ctrl-label">Filial:</span>
            <select class="ctrl-select" id="sel-filial" onchange="renderDashboard()"></select>
            <span class="ctrl-label">Ano:</span>
            <select class="ctrl-select ctrl-select-sm" id="sel-periodo" onchange="renderDashboard()">
                <option value="todos">Todos (2025+2026)</option>
                <option value="anterior">2025</option>
                <option value="atual" selected>2026</option>
            </select>
            <span class="ctrl-label">Mês:</span>
            <select class="ctrl-select ctrl-select-sm" id="sel-mes" onchange="renderDashboard()">
                <option value="todos">Todos os Meses</option>
                <option value="jan">Jan</option>
                <option value="fev">Fev</option>
                <option value="mar">Mar</option>
                <option value="abr">Abr</option>
                <option value="mai">Mai</option>
                <option value="jun">Jun</option>
                <option value="jul">Jul</option>
                <option value="ago">Ago</option>
                <option value="set">Set</option>
                <option value="out">Out</option>
                <option value="nov">Nov</option>
                <option value="dez">Dez</option>
            </select>
        </div>
        <div class="kpi-row" id="kpi-row"></div>
    </header>
    <main class="dashboard-main">
        <div class="table-card">
            <div class="table-viewport">
                <table class="exec-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        let globalData = null;
        const MESES_PT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

        async function init() {
            try {
                const res = await fetch('dre_meses.json?v=' + Date.now());
                globalData = await res.json();
                const selF = document.getElementById('sel-filial');
                
                // Adiciona opção CONSOLIDADO
                const optT = document.createElement('option'); optT.value = 'todas'; 
                optT.textContent = 'CONSOLIDADO (TODAS AS LOJAS)';
                selF.appendChild(optT);

                Object.keys(globalData.filiais).sort((a, b) => parseInt(a) - parseInt(b)).forEach(c => {
                    const opt = document.createElement('option'); opt.value = c;
                    opt.textContent = `${c} – ${globalData.filiais[c]}`;
                    selF.appendChild(opt);
                });
                
                // Padrão: CONSOLIDADO, Ano 2026, Mês Atual
                selF.value = "todas";
                document.getElementById('sel-periodo').value = "atual";
                const mesAtual = MESES_PT[new Date().getMonth()];
                document.getElementById('sel-mes').value = mesAtual;

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('filial')) selF.value = urlParams.get('filial');
                if (urlParams.get('periodo')) document.getElementById('sel-periodo').value = urlParams.get('periodo');

                renderDashboard();
                document.getElementById('loading-overlay').style.display = 'none';
            } catch (e) { console.error(e); }
        }

        function toggle(btn, parentId) {
            const exp = btn.dataset.exp === '1';
            const children = document.querySelectorAll(`[data-parent="${parentId}"]`);
            children.forEach(c => c.classList.toggle('hidden', exp));
            btn.textContent = exp ? '+' : '−';
            btn.dataset.exp = exp ? '0' : '1';
        }

        function renderDashboard() {
            if (!globalData) return;
            const cod = document.getElementById('sel-filial').value;
            const period = document.getElementById('sel-periodo').value;
            const mesFilter = document.getElementById('sel-mes').value;
            
            // Define quais filiais processar
            const fids = cod === 'todas' ? Object.keys(globalData.dados) : [cod];
            const sampleFid = fids[0];
            const dadosSample = globalData.dados[sampleFid];
            if (!dadosSample) return;

            let meses = [];
            const periods = period === 'todos' ? ['anterior', 'atual'] : [period];
            periods.forEach(p => {
                const ms = Object.keys(dadosSample[p] || {}).sort((a, b) => {
                    const [m1, a1] = a.split(' '); const [m2, a2] = b.split(' ');
                    return (parseInt(a1) * 12 + MESES_PT.indexOf(m1)) - (parseInt(a2) * 12 + MESES_PT.indexOf(m2));
                });
                ms.forEach(m => { if (mesFilter === 'todos' || m.startsWith(mesFilter)) meses.push(m); });
            });

            document.getElementById('pill-filial').textContent = cod === 'todas' ? 'CONSOLIDADO (TODAS AS LOJAS)' : `${cod} – ${globalData.filiais[cod]}`;
            document.getElementById('pill-meses').textContent = `${meses.length} Meses`;

            let headHtml = `<tr><th rowspan="1">Descrição das Contas</th>`;
            meses.forEach(m => headHtml += `<th>${m.toUpperCase()}</th>`);
            headHtml += `<th>% RL (últ)</th></tr>`;
            document.getElementById('table-head').innerHTML = headHtml;

            const parentMap = {}; let lastG = null;
            globalData.estrutura_dre.forEach(r => {
                if (String(r.plano3) === '0') lastG = String(r.ordem);
                else if (lastG) parentMap[String(r.ordem)] = lastG;
            });
            const pSet = new Set(Object.values(parentMap));

            let bodyHtml = '';
            const ORD_RL = '13';
            const ORD_RES = globalData.estrutura_dre[globalData.estrutura_dre.length - 1].ordem;

            let rlUltimo = 0;
            let resUltimo = 0;

            // Find latest non-zero RL month among shown months
            for (let i = meses.length - 1; i >= 0; i--) {
                const m = meses[i];
                const p = m.includes('2026') ? 'atual' : 'anterior';
                
                let mRL = 0, mRes = 0;
                fids.forEach(fid => {
                    mRL += (globalData.dados[fid]?.[p]?.[m]?.[ORD_RL] || 0);
                    mRes += (globalData.dados[fid]?.[p]?.[m]?.[ORD_RES] || 0);
                });

                if (Math.abs(mRL) > 0.01) {
                    rlUltimo = mRL;
                    resUltimo = mRes;
                    break;
                }
            }

            globalData.estrutura_dre.forEach(row => {
                const id = String(row.ordem); const parent = parentMap[id];
                const hasFils = pSet.has(id); const isGroup = String(row.plano3) === '0';
                const isST = row.descritivo.includes("(=)") || row.descritivo.includes("( - )");

                let rowHtml = `<tr class="${isST ? 'row-st' : ''} ${isGroup ? 'row-group' : ''} ${parent ? 'hidden' : ''}" data-parent="${parent || ''}">`;
                rowHtml += `<td style="padding-left:${parent ? 40 : 15}px">`;
                if (hasFils) rowHtml += `<span class="toggle-btn" onclick="toggle(this, '${id}')" data-exp="0">+</span>`;
                else if (parent) rowHtml += `<span class="toggle-btn empty"></span>`;
                rowHtml += `${row.descritivo}</td>`;

                meses.forEach(m => {
                    const pCell = m.includes('2026') ? 'atual' : 'anterior';
                    let vTotal = 0;
                    fids.forEach(fid => {
                        vTotal += (globalData.dados[fid]?.[pCell]?.[m]?.[id] || 0);
                    });
                    rowHtml += `<td class="${vTotal < -0.01 ? 'val-neg' : ''}">${vTotal ? vTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : ''}</td>`;
                });

                const perc = rlUltimo ? ((id in (dadosF[meses[meses.length - 1]?.includes('2026') ? 'atual' : 'anterior']?.[meses[meses.length - 1]] || {}) ? (dadosF[meses[meses.length - 1]?.includes('2026') ? 'atual' : 'anterior']?.[meses[meses.length - 1]]?.[id] || 0) : 0) / rlUltimo * 100).toFixed(1) : '0.0';
                let vForPerc = 0;
                if (meses.length) {
                    const m_last = meses[meses.length - 1];
                    const p_last = m_last.includes('2026') ? 'atual' : 'anterior';
                    fids.forEach(fid => {
                        vForPerc += (globalData.dados[fid]?.[p_last]?.[m_last]?.[id] || 0);
                    });
                }
                const realPerc = rlUltimo ? (vForPerc / rlUltimo * 100).toFixed(1) : '0.0';

                rowHtml += `<td style="background:#f0fdf4; font-weight:700; text-align:center;">${realPerc}%</td></tr>`;
                bodyHtml += rowHtml;
            });
            document.getElementById('table-body').innerHTML = bodyHtml;

            document.getElementById('kpi-row').innerHTML = `
                <div class="kpi-card"><div class="kpi-label">Filial</div><div class="kpi-val">${cod}</div></div>
                <div class="kpi-card"><div class="kpi-label">Rec. Líquida (últ)</div><div class="kpi-val">R$ ${rlUltimo.toLocaleString('pt-BR')}</div></div>
                <div class="kpi-card ${resUltimo < 0 ? 'red' : 'green'}"><div class="kpi-label">Res. Líquido (últ)</div><div class="kpi-val">R$ ${resUltimo.toLocaleString('pt-BR')}</div></div>
            `;
        }

        window.onload = init;
        function exportToExcel() {
            const table = document.querySelector(".exec-table");
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.table_to_sheet(table);

            const headerStyle = { fill: { fgColor: { rgb: "0F172A" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: { horizontal: "center" }, border: { bottom: { style: "medium", color: { rgb: "14B8A6" } } } };
            const stStyle = { fill: { fgColor: { rgb: "E0F2FE" } }, font: { bold: true, color: { rgb: "0369A1" } } };
            const groupStyle = { fill: { fgColor: { rgb: "F8FAFC" } }, font: { bold: true } };
            const negFont = { color: { rgb: "991B1B" } };

            const rows = table.querySelectorAll("tr");
            rows.forEach((row, rIdx) => {
                const isHeader = row.parentElement.tagName === "THEAD";
                const isST = row.classList.contains("row-st");
                const isGroup = row.classList.contains("row-group");

                const cells = row.querySelectorAll("th, td");
                cells.forEach((cell, cIdx) => {
                    const addr = XLSX.utils.encode_cell({ r: rIdx, c: cIdx });
                    if (!ws[addr]) return;

                    ws[addr].s = { 
                        alignment: { vertical: "center", horizontal: cIdx === 0 ? "left" : "right" },
                        font: { sz: 10 }
                    };

                    if (isHeader) {
                        ws[addr].s = { ...ws[addr].s, ...headerStyle };
                    } else {
                        if (isST) ws[addr].s = { ...ws[addr].s, ...stStyle };
                        else if (isGroup) ws[addr].s = { ...ws[addr].s, ...groupStyle };
                        if (cell.classList.contains("val-neg")) ws[addr].s.font = { ...ws[addr].s.font, ...negFont };
                    }
                });
            });

            ws['!cols'] = [{ wch: 45 }];
            for(let i=1; i<30; i++) ws['!cols'].push({ wch: 15 });

            XLSX.utils.book_append_sheet(wb, ws, "Evolucao_Mensal");
            XLSX.writeFile(wb, "DRE_Evolucao_Estilizado.xlsx");
        }
    </script>
</body>

</html>
